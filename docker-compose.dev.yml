version: '3.8'

services:
  # Neo4j Database
  neo4j:
    image: neo4j:5.14.0
    container_name: iisc-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - iisc-network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # IISc Chatbot Application
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iisc-chatbot
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
    volumes:
      # Mount data directory for ChromaDB persistence
      - ./data:/app/data
      # Mount config file
      - ./config.yaml:/app/config.yaml:ro
      # Mount logs
      - ./logs:/app/logs
      # Mount static files (optional, already in image)
      - ./static:/app/static:ro
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - iisc-network
    restart: unless-stopped

networks:
  iisc-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs: